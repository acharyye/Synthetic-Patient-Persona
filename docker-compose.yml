services:
  neo4j:
    image: neo4j:5-community
    ports:
      # Host ports are offset from the Neo4j defaults so this stack can run
      # alongside another Neo4j already bound to 7474/7687. Override with
      # NEO4J_HOST_HTTP / NEO4J_HOST_BOLT if those clash too.
      - "${NEO4J_HOST_HTTP:-7475}:7474"   # browser
      - "${NEO4J_HOST_BOLT:-7688}:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/please-change-me
      - NEO4J_PLUGINS=["apoc"]
      # Hetionet import needs more than the 512M default heap.
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  neo4j_data:
