name: Tests

# The three test surfaces, run the way the docs claim they are run. RELEASE.md
# said the E2E specs were gated by CI before this existed; the fix for a false
# claim is either to delete it or to make it true, and this is the second.
#
# One job on purpose. The E2E specs need the Python API as well as the SPA, so
# splitting by language would install Python twice to save nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded push is not worth the minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install SPA deps
        working-directory: ui
        run: npm ci

      # 1. The deterministic core. Live-graph tests skip without Neo4j, which is
      #    the point: the pipeline must be green with no external services.
      - name: Python tests
        run: pytest -q

      # 2. Generated types are committed so schema drift is a visible diff.
      #    tsc catches a stale artifacts.ts that a passing test suite would not.
      - name: SPA typecheck
        working-directory: ui
        run: npm run typecheck

      - name: SPA tests
        working-directory: ui
        run: npm test

      # 3. The three killer interactions. playwright.config.ts boots the API and
      #    the dev server itself — no hand-started processes, here or locally.
      - name: Install Playwright browser
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: ui
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
